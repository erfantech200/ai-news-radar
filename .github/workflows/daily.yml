name: Daily AI news radar

on:
  schedule:
    # 20:17 UTC = 07:17 Melbourne in summer (AEDT), 06:17 in winter (AEST).
    - cron: "17 20 * * *"
  workflow_dispatch: {}   # "Run workflow" button for a manual run

permissions:
  contents: write         # to commit the daily report and state

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Collect, analyse, send
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_MODELS: ${{ vars.GEMINI_MODELS }}
          FALLBACK_LLM_BASE_URL: ${{ vars.FALLBACK_LLM_BASE_URL }}
          FALLBACK_LLM_MODEL: ${{ vars.FALLBACK_LLM_MODEL }}
          FALLBACK_LLM_API_KEY: ${{ secrets.FALLBACK_LLM_API_KEY }}
        run: python main.py

      - name: Save report and state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports state
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "report: $(date -u +%F)"
          git pull --rebase --autostash
          git push
