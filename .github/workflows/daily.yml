name: Daily AI news radar

on:
  schedule:
    # GitHub cron is UTC. Melbourne times below are summer (AEDT); in winter (AEST) each is 1h earlier.
    - cron: "17 20 * * *"   # 07:17 Melbourne · US West Coast lunch, East Coast afternoon
    - cron: "17 2 * * *"    # 13:17 Melbourne · end of the US working day
    - cron: "17 9 * * *"    # 20:17 Melbourne · Europe's morning, Asia's afternoon
  workflow_dispatch: {}   # "Run workflow" button for a manual run

permissions:
  contents: write         # to commit the daily report and state

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Restore alert memory (to mark stories that already got an instant alert)
        uses: actions/cache/restore@v5
        with:
          path: state/alerts.json
          key: alerts-digest-${{ github.run_id }}
          restore-keys: alerts-

      - name: Collect, analyse, send
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_MODELS: ${{ vars.GEMINI_MODELS }}
          FALLBACK_LLM_BASE_URL: ${{ vars.FALLBACK_LLM_BASE_URL }}
          FALLBACK_LLM_MODEL: ${{ vars.FALLBACK_LLM_MODEL }}
          FALLBACK_LLM_API_KEY: ${{ secrets.FALLBACK_LLM_API_KEY }}
        run: python main.py

      - name: Save report and state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for d in reports state; do if [ -d "$d" ]; then git add "$d"; fi; done
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "report: $(date -u +%F)"
          git pull --rebase --autostash
          git push
