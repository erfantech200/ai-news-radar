# ─────────────────────────────────────────────────────────────
#  AI News Radar — settings
#  Edit this file to change sources, the page profile, or how many stories you get.
# ─────────────────────────────────────────────────────────────

profile:
  channel: "پیج اینستاگرام فارسی درباره هوش مصنوعی و تکنولوژی"
  audience: "فارسی‌زبان‌هایی که به هوش مصنوعی، ابزارهای جدید و آینده تکنولوژی علاقه دارن؛ از کاربر عادی تا آدم‌های فنی"
  formats: ["ریلز", "کاروسل", "استوری", "پست"]
  notes: "لحن صمیمی و پرانرژی، ولی دقیق. ابزارهایی که مخاطب خودش بتونه امتحان کنه خیلی ارزشمندن."

settings:
  timezone: "Australia/Melbourne"
  lookback_hours: 26          # how far back to read; stories already sent are always skipped
  content_items: 5            # per run (3 runs a day): stories with a full Persian brief + ideas
  other_items: 8              # per run: extra important headlines (Persian title + one line)
  ideas_per_item: 2           # content ideas per story
  min_worthiness: 6           # 1-10: below this a story never becomes a content pick
  min_importance_other: 6     # 1-10: threshold for the "other important news" list
  max_per_topic: 1            # content picks from the same saga (e.g. one company's drama)
  max_triage_items: 300
  triage_batch_size: 150      # items per scoring request (fewer requests = less quota)
  article_chars: 6000         # how much of each article the deep agent reads

# type: rss | hackernews | hf_papers
# official: true  → preferred as the main source when several outlets cover one story
# lang: language of the source (any language works; output is always Persian)
# enabled: false  → temporarily switch a source off
sources:
  # ── Official AI labs & companies
  - {name: OpenAI, type: rss, url: "https://openai.com/news/rss.xml", official: true, lang: en}
  - {name: Google DeepMind, type: rss, url: "https://deepmind.google/blog/rss.xml", official: true, lang: en}
  - {name: Google Blog, type: rss, url: "https://blog.google/rss/", official: true, lang: en}
  - {name: Hugging Face Blog, type: rss, url: "https://huggingface.co/blog/feed.xml", official: true, lang: en}
  - {name: NVIDIA Blog, type: rss, url: "https://blogs.nvidia.com/feed/", official: true, lang: en}

  # ── Tech & AI news outlets
  - {name: TechCrunch, type: rss, url: "https://techcrunch.com/category/artificial-intelligence/feed/", lang: en}
  - {name: MIT Technology Review, type: rss, url: "https://www.technologyreview.com/topic/artificial-intelligence/feed", lang: en}
  - {name: Engadget, type: rss, url: "https://www.engadget.com/rss.xml", lang: en, max_items: 25}
  - {name: Simon Willison, type: rss, url: "https://simonwillison.net/atom/everything/", lang: en}

  # ── Community signals (what people are actually talking about)
  - {name: Hacker News, type: hackernews, min_points: 150, max_items: 40}
  - {name: Hugging Face Papers, type: hf_papers, min_upvotes: 20, max_items: 12}

  # ── Sources in other languages: add any RSS feed, the agents translate to Persian.
  # - {name: "My Chinese source", type: rss, url: "https://example.com/feed", lang: zh}

# ─────────────────────────────────────────────────────────────
#  Breaking-news alerts (workflow: .github/workflows/alerts.yml)
#  Every 20 min during the US working day, hourly otherwise. Only very big news
#  (new models from top labs, huge launches, viral stories) triggers an instant message.
# ─────────────────────────────────────────────────────────────
alerts:
  enabled: true
  min_score: 8              # 1-10: only "drop everything" news
  max_per_run: 3
  window_hours: 3           # RSS posts older than this are not "breaking"
  quiet_hours: [0, 7]       # local time: alerts still arrive, but without sound
  models: ["gemini-3.5-flash-lite", "gemini-3.1-flash-lite", "gemini-3.8-flash"]
  sources:
    # Official labs (every new post is checked)
    - {name: OpenAI, type: rss, url: "https://openai.com/news/rss.xml", official: true}
    - {name: Google DeepMind, type: rss, url: "https://deepmind.google/blog/rss.xml", official: true}
    - {name: Hugging Face Blog, type: rss, url: "https://huggingface.co/blog/feed.xml", official: true}
    - {name: Anthropic, type: page, url: "https://www.anthropic.com/news", official: true,
       link_pattern: "^https://www\\.anthropic\\.com/(news/|claude-)[a-z0-9-]+$"}
    - {name: Mistral AI, type: page, url: "https://mistral.ai/news", official: true,
       link_pattern: "^https://mistral\\.ai/news/[a-z0-9-]+/?$"}
    - {name: Meta AI, type: page, url: "https://ai.meta.com/blog/", official: true,
       link_pattern: "^https://ai\\.meta\\.com/blog/[a-z0-9-]+/?$"}
    # Busy feeds: only headlines that look big are checked
    - {name: Google Blog, type: rss, url: "https://blog.google/rss/", official: true, require_keywords: true}
    - {name: TechCrunch, type: rss, url: "https://techcrunch.com/category/artificial-intelligence/feed/", require_keywords: true}
    - {name: NVIDIA Blog, type: rss, url: "https://blogs.nvidia.com/feed/", official: true, require_keywords: true}
    # What is blowing up right now
    - {name: HN viral, type: hackernews, min_points: 300, window_hours: 12, max_items: 15}
    - {name: HN rising, type: hackernews, min_points: 120, window_hours: 2, max_items: 10}
    # New open models often land on Hugging Face before the announcement
    - name: HF new models
      type: hf_models
      per_org: 8
      orgs: [openai, google, deepseek-ai, Qwen, meta-llama, mistralai, microsoft, nvidia,
             moonshotai, zai-org, MiniMaxAI, xai-org, black-forest-labs, stabilityai,
             tencent, allenai, apple, ibm-granite]
